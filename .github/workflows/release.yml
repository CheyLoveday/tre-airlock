# Release workflow — fires ONLY on a v-tag push (e.g. `git push origin v0.2.0`). It is dormant
# until a tag is pushed; it does not run on ordinary pushes/PRs (that's ci.yml). Re-runs the gates,
# builds the package, and publishes a GitHub release from the auto-generated notes + CHANGELOG.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # The runtime Lean adjudicator is the release authority: build it BEFORE the pytest gate
      # (the release-path tests exercise the real binary; there is no Python fallback).
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean adjudicator (lake build)
        run: |
          (cd formal && lake build)
      - name: Gate (ruff + full pytest incl. Python==Lean conformance)
        run: |
          uv run ruff check
          uv run pytest
      - name: Build the package
        run: uv build
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: dist/*
